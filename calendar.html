<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — Simple Motor Racing</title>
  <style>
    @font-face {
      font-family: 'Square';
      src: url('Square.ttf') format('truetype');
      font-display: swap;
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'Square';
      src: url('Squareo.ttf') format('truetype');
      font-display: swap;
      font-weight: normal;
      font-style: oblique;
    }

    :root {
      --bg:      #0d1117;
      --bg-deep: #080c12;
      --bg-mid:  #0a0f18;
      --border:  #1e2f44;
      --hi:      #ffffff;
      --mid:     #8ab4d4;
      --lo:      #4a6a88;
      --dim:     #2a4055;
      --accent:  #cc2233;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--hi);
      font-family: 'Square', 'Courier New', monospace;
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 48px;
    }

    /* ── Sticky header ────────────────────────────────────────────────────────── */
    #sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.6);
    }

    /* ── Topbar ───────────────────────────────────────────────────────────────── */
    #topbar {
      width: 100%;
      background: var(--bg-deep);
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--accent);
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 44px;
    }
    .b-flat { font-size: 15px; color: var(--hi); letter-spacing: 0.04em; flex-shrink: 0; }
    .b-flat em { font-style: normal; color: var(--mid); }
    .topbar-nav { display: flex; gap: 16px; margin-left: auto; margin-right: 16px; }
    .topbar-nav-link { color: var(--lo); text-decoration: none; font-size: 10px; letter-spacing: 0.08em; }
    .topbar-nav-link:hover { color: var(--mid); }
    .topbar-nav-link.current { color: var(--mid); }

    /* ── Dev bar ──────────────────────────────────────────────────────────────── */
    #dev-bar {
      width: 100%;
      max-width: 900px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 6px 8px;
      background: var(--bg-deep);
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--lo);
    }
    #dev-bar button {
      background: var(--bg-deep);
      color: var(--lo);
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 11px;
      padding: 2px 8px;
      cursor: pointer;
    }
    #dev-bar button:hover { color: var(--mid); border-color: var(--mid); }
    #dev-bar input[type=number] {
      width: 80px;
      background: var(--bg-deep);
      color: var(--mid);
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 11px;
      padding: 2px 4px;
    }
    .dev-label { color: var(--dim); }

    /* ── Season header ────────────────────────────────────────────────────────── */
    #season-header {
      width: 100%;
      max-width: 900px;
      padding: 10px 16px 0;
    }
    #season-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--lo);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* ── Year scroller ────────────────────────────────────────────────────────── */
    #scroller-wrap {
      display: flex;
      align-items: stretch;
      width: 100%;
      border-bottom: 1px solid var(--border);
    }

    .scroll-arrow {
      flex-shrink: 0;
      width: 28px;
      background: var(--bg-deep);
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--lo);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      margin-bottom: -1px;
    }
    .scroll-arrow:hover { color: var(--hi); background: var(--bg-mid); }
    .scroll-arrow[aria-hidden="true"] { visibility: hidden; }

    #season-scroller {
      flex: 1;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #season-scroller::-webkit-scrollbar { display: none; }

    #season-scroll-inner {
      display: flex;
      flex-wrap: nowrap;
    }

    .yr-btn {
      flex-shrink: 0;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 1px;
      padding: 8px 14px;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      color: var(--lo);
      cursor: pointer;
      margin-bottom: -1px;
    }
    .yr-btn:hover { color: var(--mid); }
    .yr-btn.active { color: var(--hi); border-bottom-color: var(--accent); }

    /* ── Calendar list ────────────────────────────────────────────────────────── */
    #calendar-list {
      width: 100%;
      max-width: 900px;
      padding: 0 0 16px;
    }

    /* ── Event card ───────────────────────────────────────────────────────────── */
    .cal-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      cursor: pointer;
    }
    .cal-card:hover { background: var(--bg-mid); }

    .cal-rnd {
      font-size: 26px;
      letter-spacing: 1px;
      color: var(--lo);
      flex-shrink: 0;
      width: 52px;
      text-align: left;
    }

    .cal-body { flex: 1; min-width: 0; }

    .cal-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 3px;
    }
    .cal-flag {
      width: 32px;
      height: 16px;
      object-fit: cover;
      border-radius: 1px;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
    }
    .cal-flag-placeholder { width: 32px; height: 16px; flex-shrink: 0; }
    .cal-event-name { font-size: 13px; color: var(--hi); letter-spacing: 0.04em; }
    .cal-circuit-name { font-size: 10px; color: var(--lo); letter-spacing: 0.05em; padding-left: 42px; }

    /* Dim upcoming rows */
    .cal-card.upcoming .cal-event-name  { color: var(--lo); }
    .cal-card.upcoming .cal-circuit-name { color: var(--dim); }
    .cal-card.upcoming .cal-rnd  { color: var(--dim); }
    .cal-card.upcoming .cal-flag { opacity: 0.4; }
  </style>
  <link rel="stylesheet" href="topnav.css">
  <script src="topnav.js" defer></script>
</head>
<body>

  <div id="sticky-header">
    <div id="topbar">
      <div class="b-flat">Simple <em>Motor Racing</em></div>
      <nav class="topbar-nav">
        <a href="index.html" class="topbar-nav-link">HOME</a>
        <a href="calendar.html" class="topbar-nav-link current">CALENDAR</a>
        <a href="drivers.html" class="topbar-nav-link">DRIVERS</a>
        <a href="team.html" class="topbar-nav-link">TEAMS</a>
        <a href="standings.html" class="topbar-nav-link">STANDINGS</a>
        <a href="champions.html" class="topbar-nav-link">CHAMPIONS</a>
      </nav>
    </div>

    <div id="dev-bar">
      <button id="dev-prev-year">◀◀ PREV YEAR</button>
      <button id="dev-prev">◀ PREV</button>
      <span id="dev-label"></span>
      <button id="dev-next">NEXT ▶</button>
      <button id="dev-next-year">NEXT YEAR ▶▶</button>
      <span class="dev-label">KEY:</span>
      <input type="number" id="world-seed-input">
      <button id="dev-reset" style="margin-left:8px;color:#cc2233;border-color:#cc2233">RESET WORLD</button>
      <button id="dev-exit" style="color:#cc2233;border-color:#cc2233">EXIT DEV</button>
    </div>

    <div id="season-header">
      <div id="season-label">World Championship Calendar</div>
      <div id="scroller-wrap">
        <button id="scroll-left"  class="scroll-arrow" aria-label="Scroll left"  aria-hidden="true">&#8249;</button>
        <div id="season-scroller">
          <div id="season-scroll-inner"></div>
        </div>
        <button id="scroll-right" class="scroll-arrow" aria-label="Scroll right" aria-hidden="true">&#8250;</button>
      </div>
    </div>
  </div>

  <div id="calendar-list"></div>

  <script type="module">
    import {
      getCurrentEvent, getCircuit, getEventForRound,
      getTodayDayOffset, getWorldSeed, setWorldSeed,
      advanceDevEvent, retreatDevEvent, advanceDevYear, retreatDevYear,
      isDevMode, enterDevMode, exitDevMode,
      resetWorld, getEventDate, formatShortDate,
    } from './championship.js';
    import { SEASON_SCHEDULE, CIRCUITS } from './data.js';

    const NAT_CODE = {
      'australia':       'au', 'new zealand':    'nz', 'argentina':      'ar',
      'mexico':          'mx', 'japan':          'jp', 'kenya':          'ke',
      'belgium':         'be', 'france':         'fr', 'italy':          'it',
      'germany':         'de', 'czechoslovakia': 'cz', 'england':        'gb',
      'sweden':          'se', 'finland':        'fi', 'hong kong':      'hk',
      'canada':          'ca', 'united states':  'us', 'pakistan':       'pk',
      'brazil':          'br', 'south africa':   'za',
    };

    // ── Dev mode entry via ?dev=1 ────────────────────────────────────────────────
    const params = new URLSearchParams(location.search);
    if (params.get('dev') === '1') {
      enterDevMode();
      history.replaceState(null, '', location.pathname);
    }

    const todayOffset  = getTodayDayOffset();
    const currentEvent = getCurrentEvent();
    const numRounds    = Math.max(...SEASON_SCHEDULE.map(e => e.round));

    let viewSeason = currentEvent.season;

    // ── Year scroller ────────────────────────────────────────────────────────────
    const scroller   = document.getElementById('season-scroller');
    const arrowLeft  = document.getElementById('scroll-left');
    const arrowRight = document.getElementById('scroll-right');

    function updateArrows() {
      const atStart = scroller.scrollLeft <= 1;
      const atEnd   = scroller.scrollLeft >= scroller.scrollWidth - scroller.clientWidth - 1;
      arrowLeft.setAttribute('aria-hidden',  atStart ? 'true' : 'false');
      arrowRight.setAttribute('aria-hidden', atEnd   ? 'true' : 'false');
    }

    arrowLeft.addEventListener('click', () => {
      scroller.scrollBy({ left: -scroller.clientWidth * 0.6, behavior: 'smooth' });
    });
    arrowRight.addEventListener('click', () => {
      scroller.scrollBy({ left:  scroller.clientWidth * 0.6, behavior: 'smooth' });
    });
    scroller.addEventListener('scroll', updateArrows);

    function buildScroller() {
      const inner = document.getElementById('season-scroll-inner');
      for (let s = 1; s <= currentEvent.season; s++) {
        const btn = document.createElement('button');
        btn.className    = 'yr-btn' + (s === viewSeason ? ' active' : '');
        btn.textContent  = 1929 + s;
        btn.dataset.s    = s;
        btn.addEventListener('click', () => {
          viewSeason = +btn.dataset.s;
          setActiveYear(true);
          buildCalendar(viewSeason);
        });
        inner.appendChild(btn);
      }
      setActiveYear(false);  // centre active year on first paint
      updateArrows();
    }

    function setActiveYear(animate) {
      let activeBtn = null;
      scroller.querySelectorAll('.yr-btn').forEach(btn => {
        const isActive = +btn.dataset.s === viewSeason;
        btn.classList.toggle('active', isActive);
        if (isActive) activeBtn = btn;
      });
      if (!activeBtn) return;
      if (animate) {
        activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      } else {
        scroller.scrollLeft = activeBtn.offsetLeft
          - scroller.clientWidth / 2
          + activeBtn.offsetWidth / 2;
      }
      updateArrows();
    }

    // ── Dev bar ──────────────────────────────────────────────────────────────────
    if (isDevMode()) {
      const devBar        = document.getElementById('dev-bar');
      const todayDateStr  = formatShortDate(getEventDate(todayOffset));
      const todayEventStr = `Race Day — R${currentEvent.round} · ${1929 + currentEvent.season}`;

      devBar.style.display = 'flex';
      document.getElementById('dev-label').textContent =
        `DEV · Day ${todayOffset} · ${todayDateStr} · ${todayEventStr}`;
      document.getElementById('world-seed-input').value = getWorldSeed();

      document.getElementById('dev-prev-year').addEventListener('click', () => { retreatDevYear(); location.reload(); });
      document.getElementById('dev-prev').addEventListener('click',      () => { retreatDevEvent(); location.reload(); });
      document.getElementById('dev-next').addEventListener('click',      () => { advanceDevEvent(); location.reload(); });
      document.getElementById('dev-next-year').addEventListener('click', () => { advanceDevYear(); location.reload(); });
      document.getElementById('world-seed-input').addEventListener('change', e => {
        setWorldSeed(parseInt(e.target.value, 10) || 0);
        location.reload();
      });
      document.getElementById('dev-reset').addEventListener('click', () => {
        if (confirm('Clear all race and qualifying results? This cannot be undone.')) {
          resetWorld(); location.reload();
        }
      });
      document.getElementById('dev-exit').addEventListener('click', () => { exitDevMode(); location.reload(); });
    }

    // ── Build calendar cards ─────────────────────────────────────────────────────
    function buildCalendar(s) {
      const seasonStart = (s - 1) * numRounds;
      const list = document.getElementById('calendar-list');
      list.innerHTML = '';

      const rounds = [];
      SEASON_SCHEDULE.forEach(entry => {
        if (!rounds.find(r => r.round === entry.round)) {
          rounds.push({ round: entry.round, circuitId: entry.circuitId });
        }
      });

      const year = 1929 + s;

      rounds.forEach(({ round, circuitId }) => {
        const circuit    = CIRCUITS[circuitId];
        const dayOffset  = seasonStart + (round - 1);
        const isUpcoming = dayOffset > todayOffset;
        const eventHref  = `event.html?season=${s}&round=${round}`;

        const flagCode = NAT_CODE[(circuit.country || '').toLowerCase()];
        const flagHtml = flagCode
          ? `<img class="cal-flag" src="https://flagcdn.com/w40/${flagCode}.png" alt="${circuit.country}">`
          : `<span class="cal-flag-placeholder"></span>`;

        const card = document.createElement('a');
        card.className = `cal-card${isUpcoming ? ' upcoming' : ''}`;
        card.href = eventHref;
        card.innerHTML = `
          <div class="cal-rnd">R${round}</div>
          <div class="cal-body">
            <div class="cal-top">
              ${flagHtml}
              <div class="cal-event-name">${year} ${circuit.eventName}</div>
            </div>
            <div class="cal-circuit-name">${circuit.name}</div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    // ── Initial render ───────────────────────────────────────────────────────────
    buildScroller();
    buildCalendar(viewSeason);
  </script>

</body>
</html>
