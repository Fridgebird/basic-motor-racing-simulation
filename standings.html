<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standings — Simple Motor Racing</title>
  <style>
    @font-face { font-family:'Square'; src:url('Square.ttf') format('truetype'); font-display:swap; font-weight:normal; }
    @font-face { font-family:'Square'; src:url('Square.ttf') format('truetype'); font-display:swap; font-weight:bold; }
    :root {
      --bg:#0d1117; --bg-deep:#080c12; --bg-mid:#0a0f18; --border:#1e2f44;
      --hi:#ffffff; --mid:#8ab4d4; --lo:#4a6a88; --dim:#2a4055; --accent:#cc2233;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--mid); font-family:'Square','Courier New',monospace; font-size:12px; min-height:100vh; display:flex; flex-direction:column; align-items:center; }

    #topbar { width:100%; height:44px; background:var(--bg-deep); border:1px solid var(--border); border-bottom:2px solid var(--accent); display:flex; align-items:center; padding:0 16px; }
    .b-flat { font-size:15px; color:var(--hi); letter-spacing:0.04em; flex-shrink:0; }
    .b-flat em { font-style:normal; color:var(--mid); }
    .topbar-nav { display:flex; gap:16px; margin-left:auto; margin-right:16px; }
    .topbar-nav-link { color:var(--lo); text-decoration:none; font-size:10px; letter-spacing:0.08em; }
    .topbar-nav-link:hover { color:var(--mid); }
    .topbar-nav-link.current { color:var(--mid); }

    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    #loading-state { padding:48px 16px; font-size:9px; letter-spacing:3px; color:var(--lo); text-align:center; width:100%; animation:pulse 1.6s ease-in-out infinite; }

    /* ── Year scroller ─────────────────────────────────────────────────────── */
    #season-scroller-wrap { display:flex; align-items:stretch; width:100%; max-width:860px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
    .scroll-arrow { flex-shrink:0; width:28px; background:var(--bg-deep); border:none; color:var(--lo); font-size:16px; line-height:1; cursor:pointer; }
    .scroll-arrow:hover { color:var(--hi); background:var(--bg-mid); }
    .scroll-arrow[aria-hidden="true"] { visibility:hidden; }
    #season-scroller { flex:1; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none; }
    #season-scroller::-webkit-scrollbar { display:none; }
    #season-scroll-inner { display:flex; flex-wrap:nowrap; }
    .yr-btn { flex-shrink:0; font-family:inherit; font-size:13px; letter-spacing:1px; padding:8px 14px; border:none; border-bottom:2px solid transparent; background:none; color:var(--lo); cursor:pointer; margin-bottom:-1px; }
    .yr-btn:hover { color:var(--mid); }
    .yr-btn.active { color:var(--hi); border-bottom-color:var(--accent); }

    #as-of-label { font-size:8px; letter-spacing:2px; color:var(--lo); text-align:center; padding:10px 0 0; width:100%; max-width:860px; }

    #page { width:100%; max-width:860px; padding:16px 16px 24px; }

    #standings-wrap { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    @media (max-width:600px) { #standings-wrap { grid-template-columns:1fr; } }

    .table-section { }
    .table-header { padding:6px 12px; font-size:9px; letter-spacing:2px; color:var(--lo); border-bottom:1px solid var(--border); background:var(--bg-deep); }
    .standings-table { width:100%; border-collapse:collapse; }
    .standings-table th { font-size:9px; letter-spacing:1px; color:var(--lo); text-align:left; padding:5px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
    .standings-table td { padding:5px 10px; font-size:11px; color:var(--mid); border-bottom:1px solid var(--dim); }
    .standings-table tr:last-child td { border-bottom:none; }
    .standings-table tr:hover td { background:var(--bg-mid); }
    .standings-table a { color:inherit; text-decoration:none; }
    .standings-table a:hover { color:var(--hi); }
    .col-pos  { color:var(--hi); width:32px; }
    .col-pos.p1 { color:var(--accent); }
    .col-pts  { color:var(--hi); text-align:right; }
    .col-w    { color:var(--lo); text-align:right; }
    .col-team { color:var(--lo); font-size:10px; }
    .team-dot { display:inline-block; width:3px; height:14px; vertical-align:middle; margin-right:6px; border-radius:1px; flex-shrink:0; }
    .no-data  { padding:20px; font-size:9px; letter-spacing:2px; color:var(--dim); text-align:center; }
    .tbl-flag { width:20px; height:10px; object-fit:cover; border-radius:1px; opacity:0.85; margin-left:6px; vertical-align:middle; }
    .team-short { display:none; }
    @media (max-width:600px) and (orientation:portrait) {
      .standings-table th, .standings-table td { padding:4px 6px; }
      .col-driver { white-space:nowrap; }
      .team-full  { display:none; }
      .team-short { display:inline; }
    }

    /* ── Driver/constructor hero cards ── */
    .hero-card { margin-bottom:16px; }
    .hc-label { font-size:8px; letter-spacing:3px; color:var(--lo); text-transform:uppercase; margin-bottom:6px; }
    .hc-inner { display:flex; align-items:stretch; background:var(--bg-mid); overflow:hidden; min-height:72px; }
    .hc-strip { width:4px; flex-shrink:0; }
    .hc-portrait { width:72px; flex-shrink:0; background-color:var(--dim); display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--lo); background-size:400% 400%; }
    .hc-badge { width:72px; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:10px; overflow:hidden; }
    .hc-badge img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
    .hc-badge-init { font-size:11px; letter-spacing:1px; text-align:center; }
    .hc-info { flex:1; min-width:100px; padding:12px 14px; overflow:hidden; display:flex; flex-direction:column; justify-content:center; }
    .hc-name { font-size:15px; color:var(--hi); letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:8px; }
    .hc-team { font-size:9px; color:var(--lo); letter-spacing:1px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hc-flag { width:32px; height:16px; object-fit:cover; border-radius:1px; opacity:0.85; flex-shrink:0; }
    .hc-carimage { flex-shrink:0; overflow:hidden; display:flex; align-items:center; padding:6px 10px 6px 8px; }
    .hc-carimage img { height:54px; width:auto; max-width:150px; object-fit:contain; }

    /* ── Season results grid ── */
    .rg-section { margin-top:28px; }
    .rg-title { font-size:9px; letter-spacing:2px; color:var(--lo); text-transform:uppercase; border-bottom:1px solid var(--border); padding-bottom:4px; }
    .rg-scroll { overflow-x:auto; }
    .rg-table { border-collapse:collapse; white-space:nowrap; }
    .rg-table th { font-size:8px; letter-spacing:0.5px; color:var(--lo); padding:4px 2px; text-align:center; border-bottom:1px solid var(--border); font-weight:normal; min-width:22px; width:22px; }
    .rg-driver-th { text-align:left !important; padding:4px 8px !important; min-width:48px !important; width:48px !important; position:sticky; left:0; background:var(--bg); z-index:2; border-right:1px solid var(--border); }
    .rg-table td { text-align:center; padding:3px 2px; border-bottom:1px solid var(--dim); color:var(--lo); min-width:22px; width:22px; font-size:10px; }
    .rg-driver-td { text-align:left !important; padding:3px 8px !important; position:sticky; left:0; background:var(--bg); z-index:1; border-right:1px solid var(--border); color:var(--mid); font-size:10px; }
    .rg-win { background:rgba(180,140,0,0.18); color:#d4a800 !important; }
    .rg-ret { color:var(--dim) !important; }
  </style>
  <link rel="stylesheet" href="topnav.css">
  <script src="topnav.js" defer></script>
</head>
<body>

  <div id="topbar">
    <span class="b-flat">Simple <em>Motor Racing</em></span>
    <nav class="topbar-nav">
      <a href="index.html" class="topbar-nav-link">HOME</a>
      <a href="calendar.html" class="topbar-nav-link">CALENDAR</a>
      <a href="drivers.html" class="topbar-nav-link">DRIVERS</a>
      <a href="team.html" class="topbar-nav-link">TEAMS</a>
      <a href="standings.html" class="topbar-nav-link current">STANDINGS</a>
      <a href="champions.html" class="topbar-nav-link">CHAMPIONS</a>
    </nav>
  </div>

  <div id="loading-state">COMPUTING HISTORY…</div>

  <div id="season-scroller-wrap" style="display:none">
    <button id="scroll-left"  class="scroll-arrow" aria-label="Scroll left"  aria-hidden="true">&#8249;</button>
    <div id="season-scroller"><div id="season-scroll-inner"></div></div>
    <button id="scroll-right" class="scroll-arrow" aria-label="Scroll right" aria-hidden="true">&#8250;</button>
  </div>
  <div id="as-of-label" style="display:none"></div>

  <div id="page" style="display:none">
    <div id="leader-hero"></div>
    <div id="ctor-hero"></div>
    <div id="standings-wrap">
      <div class="table-section">
        <div class="table-header">DRIVERS' CHAMPIONSHIP</div>
        <table class="standings-table">
          <thead><tr>
            <th class="col-pos">POS</th>
            <th>DRIVER</th>
            <th>TEAM</th>
            <th style="text-align:right">WINS</th>
            <th style="text-align:right">PTS</th>
          </tr></thead>
          <tbody id="drivers-tbody"></tbody>
        </table>
      </div>
      <div class="table-section">
        <div class="table-header">CONSTRUCTORS' CHAMPIONSHIP</div>
        <table class="standings-table">
          <thead><tr>
            <th class="col-pos">POS</th>
            <th>TEAM</th>
            <th style="text-align:right">WINS</th>
            <th style="text-align:right">PTS</th>
          </tr></thead>
          <tbody id="constructors-tbody"></tbody>
        </table>
      </div>
    </div>
    <div id="round-summary"></div>
  </div>

  <script type="module">
    import { TEAMS, ENGINES, CIRCUITS, SEASON_SCHEDULE } from './data.js';
    import { getDisplayYear, getSeasonSnapshot, getTeamEngine, getDriverProfile, getCarNumbers } from './worldstate.js';
    import {
      getCurrentEvent, getWorldSeed, getStandings, getStandingsThroughRound,
      ensurePastResultsCached, getLastCompletedRace, formatAsOfLabel,
    }                          from './championship.js';
    import { initRace, cars }  from './state.js';
    import {
      runRace, initStrategies, initWeather, setCurrentCircuit, runQualifyingSession, setFastMode,
    }                          from './simulation.js';

    const NAT_CODE = {
      'american':'us',   'argentinian':'ar', 'australian':'au', 'austrian':'at',
      'belgian':'be',    'brazilian':'br',   'british':'gb',    'canadian':'ca',
      'chinese':'cn',    'colombian':'co',   'czech':'cz',      'danish':'dk',
      'dutch':'nl',      'egyptian':'eg',    'finnish':'fi',    'french':'fr',
      'german':'de',     'ghanaian':'gh',    'greek':'gr',      'hungarian':'hu',
      'indian':'in',     'irish':'ie',       'italian':'it',    'japanese':'jp',
      'mexican':'mx',    'moroccan':'ma',    'new zealander':'nz','nigerian':'ng',
      'norwegian':'no',  'polish':'pl',      'portuguese':'pt', 'senegalese':'sn',
      'south african':'za','spanish':'es',   'swedish':'se',    'swiss':'ch',
    };

    const worldSeed     = getWorldSeed();
    const currentEvent  = getCurrentEvent();
    const currentSeason = currentEvent.season;

    const simFns = {
      initRace, cars, runRace, initStrategies, initWeather,
      setCurrentCircuit, runQualifyingSession, getSeasonSnapshot, setFastMode,
    };

    const params = new URLSearchParams(location.search);
    let viewedSeason = parseInt(params.get('season') || currentSeason, 10);
    viewedSeason = Math.max(1, Math.min(viewedSeason, currentSeason));

    let lastCompleted = null;

    function teamLabel(teamId, season) {
      const team = TEAMS.find(t => t.id === teamId);
      if (!team) return (teamId || '').toUpperCase();
      const engineId   = getTeamEngine(teamId, season, worldSeed);
      const engineName = (ENGINES[engineId]?.name ?? '').toUpperCase();
      const shortUp    = team.shortName.toUpperCase();
      return (!engineName || shortUp === engineName) ? shortUp : `${shortUp}-${engineName}`;
    }

    function buildConstructorHeroCard(teamId, teamSeason, colour, teamLabelStr, isChampion, leadCarNumber) {
      const team    = TEAMS.find(t => t.id === teamId);
      const imageId = team ? (team.carImageId || team.id.toLowerCase()) : teamId.toLowerCase();
      const eraYear = 1930 + Math.floor((teamSeason - 1) / 5) * 5;
      const label   = isChampion ? "CONSTRUCTORS' CHAMPION" : "CONSTRUCTORS' LEADER";
      const profileSrc = leadCarNumber != null
        ? `car_sprites_profile_${eraYear}_${imageId}_${leadCarNumber}.jpg`
        : `car_sprites_profile_${eraYear}_${imageId}.jpg`;

      const card = document.createElement('div');
      card.className = 'hero-card';

      const badgeDiv = document.createElement('div');
      badgeDiv.className = 'hc-badge';
      badgeDiv.style.background = colour + '22';
      const badgeImg = document.createElement('img');
      badgeImg.alt = '';
      badgeImg.src = `logos/${imageId}.webp`;
      badgeImg.onerror = () => {
        badgeImg.style.display = 'none';
        const ph = document.createElement('span');
        ph.className   = 'hc-badge-init';
        ph.textContent = (team ? team.shortName : teamId).toUpperCase().slice(0, 3);
        ph.style.color = colour;
        badgeDiv.appendChild(ph);
      };
      badgeDiv.appendChild(badgeImg);

      card.innerHTML = `
        <div class="hc-label">${label}</div>
        <div class="hc-inner">
          <div class="hc-strip" style="background:${colour}"></div>
          <div class="hc-info">
            <div class="hc-name">${teamLabelStr}</div>
          </div>
          <div class="hc-carimage">
            <img src="${profileSrc}" alt="" onerror="this.parentElement.style.display='none'">
          </div>
        </div>`;
      card.querySelector('.hc-inner').insertBefore(badgeDiv, card.querySelector('.hc-info'));
      return card;
    }

    function buildHeroCard(labelText, driverId, driverName, teamId, teamLabelStr, colour) {
      const driver  = getDriverProfile(driverId);
      const natCode = driver ? NAT_CODE[(driver.nationality || '').toLowerCase()] : null;
      const flagHtml = natCode
        ? `<img class="hc-flag" src="https://flagcdn.com/w40/${natCode}.png" alt="">`
        : '';

      let portraitStyle = `background:${colour}22;`;
      let initials = (driverName || '').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      let showInitials = true;
      if (driver && driver.portraitIndex != null && driver.portraitIndex < 32) {
        const COLS = 4, pIdx = driver.portraitIndex;
        const sheet = Math.floor(pIdx / 16) + 1;
        const pos = pIdx % 16, col = pos % COLS, row = Math.floor(pos / COLS);
        const bgX = (col / (COLS - 1) * 100).toFixed(3) + '%';
        const bgY = (row / (COLS - 1) * 100).toFixed(3) + '%';
        portraitStyle = `background-image:url('driver_sprites_16x16_${sheet}.webp');background-size:400% 400%;background-position:${bgX} ${bgY};background-color:${colour}22;`;
        showInitials = false;
      }
      const card = document.createElement('div');
      card.className = 'hero-card';
      card.innerHTML = `
        <div class="hc-label">${labelText}</div>
        <div class="hc-inner">
          <div class="hc-strip" style="background:${colour}"></div>
          <div class="hc-portrait" style="${portraitStyle}">${showInitials ? initials : ''}</div>
          <div class="hc-info">
            <div class="hc-name">${(driverName || '').toUpperCase()}${flagHtml}</div>
            <div class="hc-team">${teamLabelStr}</div>
          </div>
          <div class="hc-carimage">
            <img src="car_sprites_profile_1930_dbr_8_transparent.png" alt="" onerror="this.parentElement.style.display='none'">
          </div>
        </div>`;
      return card;
    }

    function renderStandings(season) {
      const year        = getDisplayYear(season);
      const isComplete  = season < currentSeason;

      const asOfEl = document.getElementById('as-of-label');
      let drivers, constructors, upToRound;
      if (season === currentSeason && lastCompleted) {
        const cutoffRound = lastCompleted.season === currentSeason ? lastCompleted.round : 0;
        ({ drivers, constructors } = getStandingsThroughRound(season, cutoffRound));
        asOfEl.textContent = formatAsOfLabel(lastCompleted);
        asOfEl.style.display = '';
        upToRound = cutoffRound;
      } else {
        ({ drivers, constructors } = getStandings(season));
        asOfEl.textContent = '';
        asOfEl.style.display = 'none';
        upToRound = Infinity;
      }

      // Driver hero
      const leaderHeroEl = document.getElementById('leader-hero');
      leaderHeroEl.innerHTML = '';
      if (drivers.length > 0) {
        const leader     = drivers[0];
        const leaderTeam = TEAMS.find(t => t.id === leader.teamId);
        const heroLabel  = isComplete ? "DRIVERS' CHAMPION" : 'CHAMPIONSHIP LEADER';
        leaderHeroEl.appendChild(buildHeroCard(
          heroLabel,
          leader.driverId, leader.name, leader.teamId,
          teamLabel(leader.teamId, season),
          leaderTeam ? leaderTeam.colour : '#888'
        ));
      }

      // Constructor hero
      const ctorHeroEl = document.getElementById('ctor-hero');
      ctorHeroEl.innerHTML = '';
      if (constructors.length > 0) {
        const ctorLeader   = constructors[0];
        const ctorTeam     = TEAMS.find(t => t.id === ctorLeader.id);
        const carNumbers   = getCarNumbers(season, worldSeed);
        const leadDriver   = drivers.find(d => d.teamId === ctorLeader.id);
        const leadCarNum   = leadDriver ? (carNumbers.get(leadDriver.driverId) ?? null) : null;
        ctorHeroEl.appendChild(buildConstructorHeroCard(
          ctorLeader.id, season,
          ctorTeam ? ctorTeam.colour : '#888',
          teamLabel(ctorLeader.id, season),
          isComplete,
          leadCarNum
        ));
      }

      // Drivers table
      const driversTbody = document.getElementById('drivers-tbody');
      driversTbody.innerHTML = '';
      if (!drivers.length) {
        driversTbody.innerHTML = '<tr><td colspan="5" class="no-data">NO DATA YET</td></tr>';
      } else {
        drivers.forEach((d, i) => {
          const pos      = i + 1;
          const team     = TEAMS.find(t => t.id === d.teamId);
          const dot      = team ? `<span class="team-dot" style="background:${team.colour}"></span>` : '';
          const label    = teamLabel(d.teamId, season);
          const shortLbl = team ? team.shortName.toUpperCase() : label;
          const dp       = d.driverId != null ? getDriverProfile(d.driverId) : null;
          const natCode  = dp ? NAT_CODE[(dp.nationality || '').toLowerCase()] : null;
          const flag     = natCode ? `<img class="tbl-flag" src="https://flagcdn.com/w40/${natCode}.png" alt="">` : '';
          const teamLink = team
            ? `<a class="team-full" href="team.html?id=${team.id}&season=${season}">${label}</a>` +
              `<a class="team-short" href="team.html?id=${team.id}&season=${season}">${shortLbl}</a>`
            : `<span class="team-full">${label}</span><span class="team-short">${shortLbl}</span>`;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="col-pos${pos === 1 ? ' p1' : ''}">${pos}</td>
            <td class="col-driver">${d.driverId != null
              ? `<a href="driver.html?id=${d.driverId}&season=${season}">${d.name.toUpperCase()}</a>`
              : d.name.toUpperCase()
            }${flag}</td>
            <td class="col-team">${dot}${teamLink}</td>
            <td class="col-w">${d.wins}</td>
            <td class="col-pts">${d.points}</td>
          `;
          driversTbody.appendChild(tr);
        });
      }

      // Constructors table
      const ctorTbody = document.getElementById('constructors-tbody');
      ctorTbody.innerHTML = '';
      if (!constructors.length) {
        ctorTbody.innerHTML = '<tr><td colspan="4" class="no-data">NO DATA YET</td></tr>';
      } else {
        constructors.forEach((c, i) => {
          const pos   = i + 1;
          const team  = TEAMS.find(t => t.id === c.id);
          const dot   = team ? `<span class="team-dot" style="background:${team.colour}"></span>` : '';
          const label = teamLabel(c.id, season);
          const name  = team
            ? `<a href="team.html?id=${team.id}&season=${season}">${dot}${label}</a>`
            : c.id.toUpperCase();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="col-pos${pos === 1 ? ' p1' : ''}">${pos}</td>
            <td>${name}</td>
            <td class="col-w">${c.wins}</td>
            <td class="col-pts">${c.points}</td>
          `;
          ctorTbody.appendChild(tr);
        });
      }

      const summaryEl = document.getElementById('round-summary');
      summaryEl.innerHTML = '';
      renderRoundSummary(summaryEl, season, upToRound, drivers);

      window.history.replaceState(null, '', `standings.html?season=${season}`);
    }

    // ── Year scroller ───────────────────────────────────────────────────────────
    const scroller   = document.getElementById('season-scroller');
    const arrowLeft  = document.getElementById('scroll-left');
    const arrowRight = document.getElementById('scroll-right');

    function updateArrows() {
      const atStart = scroller.scrollLeft <= 1;
      const atEnd   = scroller.scrollLeft >= scroller.scrollWidth - scroller.clientWidth - 1;
      arrowLeft.setAttribute('aria-hidden',  atStart ? 'true' : 'false');
      arrowRight.setAttribute('aria-hidden', atEnd   ? 'true' : 'false');
    }

    arrowLeft.addEventListener('click',  () => scroller.scrollBy({ left: -scroller.clientWidth * 0.6, behavior: 'smooth' }));
    arrowRight.addEventListener('click', () => scroller.scrollBy({ left:  scroller.clientWidth * 0.6, behavior: 'smooth' }));
    scroller.addEventListener('scroll', updateArrows);

    function setActiveYear(animate) {
      let activeBtn = null;
      scroller.querySelectorAll('.yr-btn').forEach(btn => {
        const isActive = +btn.dataset.s === viewedSeason;
        btn.classList.toggle('active', isActive);
        if (isActive) activeBtn = btn;
      });
      if (!activeBtn) return;
      if (animate) {
        activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      } else {
        scroller.scrollLeft = activeBtn.offsetLeft - scroller.clientWidth / 2 + activeBtn.offsetWidth / 2;
      }
      updateArrows();
    }

    function buildScroller() {
      const inner = document.getElementById('season-scroll-inner');
      inner.innerHTML = '';
      for (let s = 1; s <= currentSeason; s++) {
        const btn = document.createElement('button');
        btn.className   = 'yr-btn' + (s === viewedSeason ? ' active' : '');
        btn.textContent = getDisplayYear(s);
        btn.dataset.s   = s;
        btn.addEventListener('click', () => {
          viewedSeason = +btn.dataset.s;
          setActiveYear(true);
          renderStandings(viewedSeason);
        });
        inner.appendChild(btn);
      }
      setActiveYear(false);
      updateArrows();
    }

    (async () => {
      await new Promise(r => setTimeout(r, 0));
      for (let s = 1; s <= currentSeason; s++) {
        await ensurePastResultsCached(s, simFns);
      }
      lastCompleted = getLastCompletedRace();
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('season-scroller-wrap').style.display = '';
      document.getElementById('as-of-label').style.display = '';
      document.getElementById('page').style.display = '';
      buildScroller();
      renderStandings(viewedSeason);
    })();

    function renderRoundSummary(container, season, upToRound, orderedDrivers) {
      const { races } = getStandings(season);
      const drivers = orderedDrivers || [];
      if (!drivers.length) return;

      const teamColours = Object.fromEntries(TEAMS.map(t => [t.id, t.colour]));

      const rounds = SEASON_SCHEDULE
        .filter(e => e.eventType === 'race' && races[e.round] && e.round <= upToRound)
        .sort((a, b) => a.round - b.round);
      if (!rounds.length) return;

      const resultMap = {};
      for (const { round: r } of rounds) {
        for (const entry of races[r]) {
          if (!resultMap[entry.driverName]) resultMap[entry.driverName] = {};
          resultMap[entry.driverName][r] = { position: entry.position, retired: entry.retired };
        }
      }

      const section = document.createElement('div');
      section.className = 'rg-section';
      const title = document.createElement('div');
      title.className = 'rg-title';
      title.textContent = 'SEASON RESULTS';
      section.appendChild(title);

      const scroll = document.createElement('div');
      scroll.className = 'rg-scroll';
      const table = document.createElement('table');
      table.className = 'rg-table';

      const thead = document.createElement('thead');
      const hr = document.createElement('tr');
      const th0 = document.createElement('th');
      th0.className = 'rg-driver-th';
      hr.appendChild(th0);
      for (const { round: r, circuitId } of rounds) {
        const th = document.createElement('th');
        th.textContent = CIRCUITS[circuitId].abbrev;
        th.title = `R${r} · ${CIRCUITS[circuitId].eventName}`;
        hr.appendChild(th);
      }
      thead.appendChild(hr);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      for (const driver of drivers) {
        const tr = document.createElement('tr');
        const td0 = document.createElement('td');
        td0.className = 'rg-driver-td';
        const colour = teamColours[driver.teamId] || '#888';
        const surname = driver.name.split(' ').pop().slice(0, 3).toUpperCase();
        td0.innerHTML = `<span class="team-dot" style="background:${colour};height:10px"></span> ${surname}`;
        tr.appendChild(td0);

        for (const { round: r } of rounds) {
          const res = (resultMap[driver.name] || {})[r];
          const td = document.createElement('td');
          if (!res) {
            td.textContent = '–';
          } else if (res.retired) {
            td.textContent = 'R';
            td.classList.add('rg-ret');
          } else {
            td.textContent = res.position;
            if (res.position === 1) td.classList.add('rg-win');
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      scroll.appendChild(table);
      section.appendChild(scroll);
      container.appendChild(section);
    }
  </script>
</body>
