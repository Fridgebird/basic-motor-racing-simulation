<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constructor Profile — Simple Motor Racing</title>
  <style>
    @font-face { font-family:'Square'; src:url('Square.ttf') format('truetype'); font-display:swap; font-weight:normal; }
    @font-face { font-family:'Square'; src:url('Square.ttf') format('truetype'); font-display:swap; font-weight:bold; }
    :root {
      --bg:#0d1117; --bg-deep:#080c12; --bg-mid:#0a0f18; --border:#1e2f44;
      --hi:#ffffff; --mid:#8ab4d4; --lo:#4a6a88; --dim:#2a4055; --accent:#cc2233;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--mid); font-family:'Square','Courier New',monospace; font-size:12px; min-height:100vh; display:flex; flex-direction:column; align-items:center; }

    #topbar { width:100%; height:44px; background:var(--bg-deep); border:1px solid var(--border); border-bottom:2px solid var(--accent); display:flex; align-items:center; padding:0 16px; }
    .b-flat { font-size:15px; color:var(--hi); letter-spacing:0.04em; flex-shrink:0; }
    .b-flat em { font-style:normal; color:var(--mid); }
    .topbar-nav { display:flex; gap:16px; margin-left:auto; margin-right:16px; }
    .topbar-nav-link { color:var(--lo); text-decoration:none; font-size:10px; letter-spacing:0.08em; }
    .topbar-nav-link:hover { color:var(--mid); }
    .topbar-nav-link.current { color:var(--mid); }

    #sticky-header { position:sticky; top:0; z-index:100; width:100%; background:var(--bg); display:flex; flex-direction:column; align-items:center; box-shadow:0 3px 12px rgba(0,0,0,0.6); }

    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    #loading-state { padding:48px 16px; font-size:9px; letter-spacing:3px; color:var(--lo); text-align:center; width:100%; animation:pulse 1.6s ease-in-out infinite; }
    #as-of-label { font-size:8px; letter-spacing:2px; color:var(--lo); text-align:left; flex-basis:100%; padding-top:4px; }

    #page { width:100%; max-width:760px; padding:16px 16px 24px; }

    #team-nav-wrap { display:flex; align-items:stretch; width:100%; max-width:760px; border-bottom:1px solid var(--border); }
    #team-scroller { flex:1; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none; }
    #team-scroller::-webkit-scrollbar { display:none; }
    #team-scroll-inner { display:flex; flex-wrap:nowrap; }

    #profile-card { background:var(--bg-mid); margin-bottom:20px; overflow:hidden; }

    #season-drivers { padding:16px 20px; }
    #car-tech-row { display:flex; align-items:stretch; height:280px; }
    #car-wrap { flex:1; background:#111418; overflow:hidden; }
    #car-sprite { width:100%; height:100%; }
    .car-img { width:100%; height:100%; object-fit:cover; display:block; }
    .car-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:9px; letter-spacing:3px; }
    .logo-img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
    .logo-placeholder { font-size:8px; letter-spacing:2px; text-align:center; }

    #team-header { display:flex; align-items:stretch; }
    #team-badge { width:110px; flex-shrink:0; background:var(--bg-deep); display:flex; align-items:center; justify-content:center; padding:12px; overflow:hidden; }
    #livery-bar { width:4px; flex-shrink:0; border-radius:1px; }
    #team-info { flex:1; min-width:0; padding:16px 20px 12px; display:flex; flex-direction:column; gap:6px; }
    #team-meta { font-size:9px; letter-spacing:2px; color:var(--lo); display:flex; align-items:center; gap:8px; }

    #career-stats { display:flex; gap:0 24px; flex-wrap:wrap; padding:16px 20px; }
    .stat-block { display:flex; flex-direction:column; gap:3px; }
    .stat-value { font-size:18px; color:var(--hi); letter-spacing:1px; }
    .stat-label { font-size:10px; letter-spacing:2px; color:#638aaa; text-transform:uppercase; }

    /* ── Year scroller ──────────────────────────────────────────────────────── */
    #season-scroller-wrap { display:flex; align-items:stretch; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
    .scroll-arrow { flex-shrink:0; width:28px; background:var(--bg-deep); border:none; border-bottom:1px solid var(--border); color:var(--lo); font-size:16px; line-height:1; cursor:pointer; margin-bottom:-1px; }
    .scroll-arrow:hover { color:var(--hi); background:var(--bg-mid); }
    .scroll-arrow[aria-hidden="true"] { visibility:hidden; }
    #season-scroller { flex:1; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none; }
    #season-scroller::-webkit-scrollbar { display:none; }
    #season-scroll-inner { display:flex; flex-wrap:nowrap; }
    .yr-btn { flex-shrink:0; font-family:inherit; font-size:13px; letter-spacing:1px; padding:8px 14px; border:none; border-bottom:2px solid transparent; background:none; color:var(--lo); cursor:pointer; margin-bottom:-1px; }
    .yr-btn:hover { color:var(--mid); }
    .yr-btn.active { color:var(--hi); border-bottom-color:var(--accent); }

    #season-tech { padding:16px 20px; display:flex; flex-direction:column; justify-content:flex-start; gap:16px; flex-shrink:0; width:220px; }
    .era-tech-header { margin-bottom:-4px; padding-bottom:10px; border-bottom:1px solid var(--dim); }
    .era-tech-link { font-family:inherit; font-size:11px; letter-spacing:1.5px; color:var(--mid); text-transform:uppercase; background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; display:block; margin-bottom:4px; text-align:left; }
    .era-tech-link:hover { color:var(--hi); font-weight:bold; }
    .era-tech-period { font-size:10px; letter-spacing:1px; color:var(--lo); }
    .era-name { font-size:12px; color:var(--hi); letter-spacing:0.5px; margin-bottom:2px; font-weight:400; }
    .era-years { font-size:9px; letter-spacing:2px; color:var(--lo); text-transform:uppercase; margin-bottom:10px; font-family:'Square','Courier New',monospace; }
    .era-summary { font-size:11px; color:var(--mid); line-height:1.5; margin-bottom:10px; }
    .era-section { display:flex; gap:8px; margin-bottom:6px; font-size:10px; line-height:1.4; }
    .era-label { font-size:8px; letter-spacing:1.5px; color:var(--lo); text-transform:uppercase; font-family:'Square','Courier New',monospace; flex-shrink:0; padding-top:1px; width:46px; }
    .era-text { color:var(--mid); }
    .tech-row { display:flex; align-items:center; gap:10px; font-size:11px; letter-spacing:1px; flex-wrap:wrap; }
    .tech-key { color:var(--lo); width:66px; flex-shrink:0; }
    .tech-val { color:var(--hi); min-width:80px; }
    .tech-pips { display:flex; gap:10px; }
    .pip-group { display:flex; align-items:center; gap:2px; }
    .pip-group .pip { width:7px; height:7px; border-radius:1px; border:1px solid currentColor; }
    .pip-group .pip.on { background:currentColor; }
    .pip-label { font-size:10px; letter-spacing:0.5px; margin-left:3px; opacity:0.65; }
    .pip-power, .pip-burn, .pip-grip, .pip-wear, .pip-tank { color:var(--accent); }

    .section-label { font-size:8px; letter-spacing:2px; color:var(--lo); text-transform:uppercase; margin-bottom:10px; }
    #driver-list { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

    .driver-chip { display:flex; align-items:center; gap:10px; background:var(--bg-deep); padding:12px 18px; text-decoration:none; color:inherit; }
    .driver-chip:hover { background:var(--bg-mid); }
    .driver-chip-portrait { width:48px; height:48px; flex-shrink:0; border:1px solid var(--border); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:bold; }
    .driver-chip-portrait img { width:48px; height:48px; object-fit:cover; display:block; }
    .driver-chip-num { width:36px; height:36px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:bold; color:var(--hi); letter-spacing:0; }
    .driver-chip-name { font-size:12px; color:var(--hi); display:flex; align-items:center; gap:6px; }
    .driver-chip-nat { font-size:10px; letter-spacing:1px; color:var(--lo); }
    .chip-flag { width:24px; height:12px; object-fit:cover; border-radius:1px; opacity:0.85; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15); }
    #team-name { font-size:18px; letter-spacing:2px; color:var(--hi); font-weight:bold; display:flex; align-items:center; gap:8px; white-space:nowrap; overflow:hidden; height:24px; }
    .team-sponsor { color:var(--lo); font-weight:normal; flex-shrink:0; }
    .flag-strip { width:48px; height:24px; border-radius:2px; object-fit:cover; display:block; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2); }

    #season-history { border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
    .history-header { padding:6px 12px; font-size:9px; letter-spacing:2px; color:var(--lo); border-bottom:1px solid var(--border); background:var(--bg-deep); }
    .history-table { width:100%; border-collapse:collapse; }
    .history-table th { font-size:9px; letter-spacing:1px; color:var(--lo); text-align:left; padding:5px 12px; border-bottom:1px solid var(--border); }
    .history-table th.h-pts, .history-table th.h-wins { text-align:right; }
    .history-table td { padding:6px 12px; font-size:11px; color:var(--mid); border-bottom:1px solid var(--dim); }
    .history-table tr:last-child td { border-bottom:none; }
    .history-table td.h-year   { color:var(--lo); width:52px; }
    .history-table td.h-pos    { color:var(--hi); width:36px; }
    .history-table td.h-pts    { color:var(--hi); text-align:right; }
    .history-table td.h-wins   { color:var(--lo); text-align:right; }
    .champ-marker { color:var(--accent); font-size:10px; margin-left:4px; }

    #formula-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:998; cursor:pointer; }
    #formula-overlay.open { display:block; }
    #formula-popup { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1e2d3f; border:2px solid var(--accent); padding:28px 32px; max-width:500px; width:90%; z-index:999; max-height:80vh; overflow-y:auto; }
    #formula-popup.open { display:block; }
    #formula-popup-inner { font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; font-weight:300; }
    #formula-popup-close { font-family:inherit; font-size:9px; letter-spacing:2px; color:var(--lo); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; margin-top:20px; display:block; text-transform:uppercase; }
    #formula-popup-close:hover { color:var(--hi); font-weight:bold; }

    @media (max-width:520px) {
      #career-stats { gap:16px; }
      #driver-list { grid-template-columns:1fr; }
      #team-badge { width:80px; padding:8px; }
      #car-tech-row { flex-direction:column; height:auto; }
      #season-tech { width:100%; }
      #car-wrap { height:160px; }
      .tech-pips { flex-direction:column; gap:4px; }
    }
  </style>
  <link rel="stylesheet" href="topnav.css">
  <script src="topnav.js" defer></script>
</head>
<body>

  <div id="sticky-header">
    <div id="topbar">
      <span class="b-flat">Simple <em>Motor Racing</em></span>
      <nav class="topbar-nav">
        <a href="index.html" class="topbar-nav-link">HOME</a>
        <a href="calendar.html" class="topbar-nav-link">CALENDAR</a>
        <a href="drivers.html" class="topbar-nav-link">DRIVERS</a>
        <a href="team.html" class="topbar-nav-link current">TEAMS</a>
        <a href="standings.html" class="topbar-nav-link">STANDINGS</a>
        <a href="champions.html" class="topbar-nav-link">CHAMPIONS</a>
      </nav>
    </div>
    <div id="team-nav-wrap" style="display:none">
      <button id="tnav-left"  class="scroll-arrow" aria-label="Scroll left"  aria-hidden="true">&#8249;</button>
      <div id="team-scroller"><div id="team-scroll-inner"></div></div>
      <button id="tnav-right" class="scroll-arrow" aria-label="Scroll right" aria-hidden="true">&#8250;</button>
    </div>
  </div>

  <div id="loading-state">COMPUTING HISTORY…</div>

  <div id="page" style="display:none">
    <div id="profile-card">
      <div id="team-header">
        <div id="team-badge"></div>
        <div id="livery-bar"></div>
        <div id="team-info">
          <div id="team-name">—</div>
          <div id="team-meta">—</div>
        </div>
      </div>
      <div id="career-stats">
        <div class="stat-block"><div class="stat-value" id="s-seasons">—</div><div class="stat-label">Seasons</div></div>
        <div class="stat-block"><div class="stat-value" id="s-wins">—</div><div class="stat-label">Wins</div></div>
        <div class="stat-block"><div class="stat-value" id="s-pts">—</div><div class="stat-label">Points</div></div>
        <div class="stat-block"><div class="stat-value" id="s-titles">—</div><div class="stat-label">Titles</div></div>
        <div id="as-of-label"></div>
      </div>
      <div id="season-scroller-wrap">
        <button id="scroll-left"  class="scroll-arrow" aria-label="Scroll left"  aria-hidden="true">&#8249;</button>
        <div id="season-scroller"><div id="season-scroll-inner"></div></div>
        <button id="scroll-right" class="scroll-arrow" aria-label="Scroll right" aria-hidden="true">&#8250;</button>
      </div>
      <div id="season-drivers">
        <div id="driver-list"></div>
      </div>
      <div id="car-tech-row">
        <div id="season-tech"></div>
        <div id="car-wrap"><div id="car-sprite"></div></div>
      </div>
    </div>

    <div id="season-history">
      <div class="history-header">CONSTRUCTORS' CHAMPIONSHIP HISTORY</div>
      <table class="history-table">
        <thead>
          <tr>
            <th class="h-year">YEAR</th>
            <th class="h-pos">POS</th>
            <th>DRIVERS</th>
            <th class="h-pts">PTS</th>
            <th class="h-wins">WINS</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { TEAMS, ENGINES, TYRES }       from './data.js';
    import {
      getActiveRoster, getDisplayYear, getChassisId,
      getTeamEngine, getTeamTyre, getSeasonSnapshot, getCarNumbers,
      getFormulaEra, getDriverProfile,
    }                                       from './worldstate.js';
    import {
      getCurrentEvent, getWorldSeed, getConstructorHistory, loadSeasonSummary,
      ensurePastResultsCached, getStandings, getStandingsThroughRound,
      getLastCompletedRace, formatAsOfLabel,
    }                                       from './championship.js';
    import { initRace, cars }               from './state.js';
    import {
      runRace, initStrategies, initWeather, setCurrentCircuit, runQualifyingSession, setFastMode,
    }                                       from './simulation.js';

    const NAT_CODE = {
      'american':'us',   'argentinian':'ar', 'australian':'au', 'austrian':'at',
      'belgian':'be',    'brazilian':'br',   'british':'gb',    'canadian':'ca',
      'chinese':'cn',    'colombian':'co',   'czech':'cz',      'danish':'dk',
      'dutch':'nl',      'egyptian':'eg',    'finnish':'fi',    'french':'fr',
      'german':'de',     'ghanaian':'gh',    'greek':'gr',      'hungarian':'hu',
      'indian':'in',     'irish':'ie',       'italian':'it',    'japanese':'jp',
      'mexican':'mx',    'moroccan':'ma',    'new zealander':'nz','nigerian':'ng',
      'norwegian':'no',  'polish':'pl',      'portuguese':'pt', 'senegalese':'sn',
      'south african':'za','spanish':'es',   'swedish':'se',    'swiss':'ch',
    };

    // Fallback until sponsors.js is dynamically loaded; returns null = no sponsor shown
    let getTitleSponsorEntry = () => null;

    const params        = new URLSearchParams(location.search);
    const teamIdParam   = params.get('id');
    const worldSeed     = getWorldSeed();
    const currentEvent  = getCurrentEvent();
    const currentSeason = currentEvent.season;

    const simFns = {
      initRace, cars, runRace, initStrategies, initWeather,
      setCurrentCircuit, runQualifyingSession, getSeasonSnapshot, setFastMode,
    };

    const SORTED_TEAMS = [...TEAMS].sort((a, b) => a.baseNumbers[0] - b.baseNumbers[0]);

    let teamIdx = 0;
    if (teamIdParam) {
      const found = SORTED_TEAMS.findIndex(t => t.id === teamIdParam);
      if (found >= 0) teamIdx = found;
    }

    let viewedSeason = parseInt(params.get('season') || currentSeason, 10);
    viewedSeason = Math.max(1, Math.min(viewedSeason, currentSeason));

    // Set after ensurePastResultsCached completes (spoiler-free cutoff)
    let lastCompleted            = null;
    let currentSeasonCtorStandings = null;

    function updateCarImage(team, season) {
      const chassisEra = Math.floor((season - 1) / 5) + 1;
      const eraYear    = 1930 + (chassisEra - 1) * 5;
      const imageId    = team.carImageId || team.id.toLowerCase();
      const wrap       = document.getElementById('car-sprite');
      wrap.innerHTML   = '';

      const img = document.createElement('img');
      img.className = 'car-img';
      img.alt = '';
      img.onerror = () => {
        wrap.removeChild(img);
        const ph = document.createElement('div');
        ph.className   = 'car-placeholder';
        ph.textContent = `${team.shortName.toUpperCase()} · ${eraYear}`;
        ph.style.color = team.colour;
        wrap.appendChild(ph);
      };
      img.src = `car_sprites_${eraYear}_${imageId}.webp`;
      wrap.appendChild(img);
    }

    function updateTeamLogo(team) {
      const imageId  = team.carImageId || team.id.toLowerCase();
      const wrap     = document.getElementById('team-badge');
      wrap.innerHTML = '';

      const img = document.createElement('img');
      img.className = 'logo-img';
      img.alt = '';
      img.onerror = () => {
        wrap.removeChild(img);
        const ph = document.createElement('div');
        ph.className   = 'logo-placeholder';
        ph.textContent = team.shortName.toUpperCase();
        ph.style.color = team.colour;
        wrap.appendChild(ph);
      };
      img.src = `logos/${imageId}.webp`;
      wrap.appendChild(img);
    }

    function makePortraitEl(poolDriver, teamColour) {
      const wrap = document.createElement('div');
      wrap.className = 'driver-chip-portrait';
      const pIdx = poolDriver.portraitIndex;
      if (pIdx != null && pIdx < 32) {
        const COLS = 4, SRC = 32, DISP = 48;
        const sheet = Math.floor(pIdx / 16) + 1;
        const pos   = pIdx % 16;
        const col   = pos % COLS;
        const row   = Math.floor(pos / COLS);
        wrap.style.cssText = `background-image:url('driver_sprites_16x16_${sheet}.webp');background-size:${DISP*COLS}px ${DISP*COLS}px;background-position:${-(col*DISP)}px ${-(row*DISP)}px;background-color:${teamColour}22;`;
      } else {
        wrap.style.background = `${teamColour}22`;
        wrap.style.color      = teamColour;
        wrap.textContent = (poolDriver.firstName[0] + poolDriver.lastName[0]).toUpperCase();
      }
      return wrap;
    }

    function renderSeasonPane(team, season) {
      const year         = getDisplayYear(season);
      const seasonSponsor = getTitleSponsorEntry(team.id, year);
      const engineId  = getTeamEngine(team.id, season, worldSeed);
      const tyreId    = getTeamTyre(team.id, season, worldSeed);
      const chassis   = getChassisId(team.id, season);
      const engineName = (ENGINES[engineId]?.name ?? engineId).toUpperCase();
      const tyreName   = (TYRES[tyreId]?.name   ?? tyreId).toUpperCase();

      const snapshot  = getSeasonSnapshot(season, worldSeed);
      const eng       = snapshot.engines[engineId] ?? ENGINES[engineId];
      const tyr       = snapshot.tyres[tyreId]     ?? TYRES[tyreId];
      const teamSnap  = snapshot.teams.find(t => t.id === team.id);

      updateCarImage(team, season);
      updateTeamLogo(team);
      setActiveYear(true);

      const formulaEra = getFormulaEra(season);
      const formulaHeaderHtml = formulaEra ? `
        <div class="era-tech-header">
          <button class="era-tech-link" id="era-link-btn">${formulaEra.name.toUpperCase()}</button>
          <div class="era-tech-period">${formulaEra.years}</div>
        </div>
      ` : '';

      document.getElementById('season-tech').innerHTML = formulaHeaderHtml + `
        <div class="tech-row">
          <span class="tech-key">CHASSIS</span>
          <span class="tech-val">${chassis}</span>
          <div class="tech-pips">
            ${pips(bucket(teamSnap?.fuelCapacity ?? 110, [103, 121]), 'pip-tank', 'FUEL TANK CAPACITY')}
          </div>
        </div>
        <div class="tech-row">
          <span class="tech-key">ENGINE</span>
          <span class="tech-val">${engineName}</span>
          <div class="tech-pips">
            ${pips(bucket(eng.power,        [68, 82]),      'pip-power', 'POWER')}
            ${pips(bucket(eng.fuelBurnRate, [1.03, 1.12]),  'pip-burn',  'CONSUMPTION')}
          </div>
        </div>
        <div class="tech-row">
          <span class="tech-key">TYRES</span>
          <span class="tech-val">${tyreName}</span>
          <div class="tech-pips">
            ${pips(bucket(tyr.maxGrip,  [78, 86]),          'pip-grip', 'GRIP')}
            ${pips(bucket(tyr.wearRate, [0.0108, 0.0127]),  'pip-wear', 'WEAR')}
          </div>
        </div>
        ${seasonSponsor ? `
        <div class="tech-row" style="margin-top:auto; margin-bottom:8px;">
          <span class="tech-key">SPONSOR</span>
          <span class="tech-val">${seasonSponsor.url
            ? `<a href="${seasonSponsor.url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;">${seasonSponsor.sponsor}</a>`
            : seasonSponsor.sponsor}</span>
        </div>` : ''}
      `;

      if (formulaEra) {
        document.getElementById('era-link-btn').addEventListener('click', () => {
          document.getElementById('formula-popup-inner').innerHTML = `
            <div class="era-name">${formulaEra.name}</div>
            <div class="era-years">${formulaEra.years}</div>
            <div class="era-summary">${formulaEra.summary}</div>
            <div class="era-section"><span class="era-label">Chassis</span><span class="era-text">${formulaEra.chassis}</span></div>
            <div class="era-section"><span class="era-label">Engine</span><span class="era-text">${formulaEra.engine}</span></div>
            <div class="era-section"><span class="era-label">Tyres</span><span class="era-text">${formulaEra.tyres}</span></div>
          `;
          document.getElementById('formula-overlay').classList.add('open');
          document.getElementById('formula-popup').classList.add('open');
        });
      }

      const seasonRoster = getActiveRoster(season, worldSeed).filter(e => e.teamId === team.id);
      const carNumbers   = getCarNumbers(season, worldSeed);
      const driverList   = document.getElementById('driver-list');
      driverList.innerHTML = '';
      seasonRoster.forEach(entry => {
        const pd = getDriverProfile(entry.driverId);
        if (!pd) return;
        const nat  = pd.nationality.charAt(0).toUpperCase() + pd.nationality.slice(1);
        const num  = carNumbers.get(entry.driverId) ?? '';
        const yrsLeft = entry.contractEnd - season + 1;
        const yrsStr  = yrsLeft === 1 ? '1 YR' : `${yrsLeft} YRS`;
        const chip = document.createElement('a');
        chip.href      = `driver.html?id=${entry.driverId}&season=${season}`;
        chip.className = 'driver-chip';
        chip.appendChild(makePortraitEl(pd, team.colour));
        const numEl = document.createElement('div');
        numEl.className   = 'driver-chip-num';
        numEl.style.color = team.colour;
        numEl.textContent = num;
        chip.appendChild(numEl);
        const chipNatCode = NAT_CODE[pd.nationality.toLowerCase()];
        const chipFlag = chipNatCode ? `<img class="chip-flag" alt="" src="https://flagcdn.com/w40/${chipNatCode}.png">` : '';
        const info = document.createElement('div');
        info.innerHTML = `<div class="driver-chip-name">${pd.firstName} ${pd.lastName}${chipFlag}</div><div class="driver-chip-nat">${nat} - ${yrsStr} CONTRACT</div>`;
        chip.appendChild(info);
        driverList.appendChild(chip);
      });

    }

    function renderTeam(idx) {
      const team        = SORTED_TEAMS[idx];
      const ctorHistory = getConstructorHistory(team.id); // completed seasons only
      const csEntry     = currentSeasonCtorStandings?.constructors.find(c => c.id === team.id);

      const totals = ctorHistory.reduce((acc, s) => ({
        wins:   acc.wins   + s.wins,
        pts:    acc.pts    + s.points,
        titles: acc.titles + (s.champion ? 1 : 0),
      }), { wins:0, pts:0, titles:0 });
      if (csEntry) { totals.wins += csEntry.wins; totals.pts += csEntry.points; }
      const seasonCount = ctorHistory.length + (csEntry ? 1 : 0);

      document.getElementById('livery-bar').style.background = team.colour;

      const nameEl = document.getElementById('team-name');
      nameEl.innerHTML = '';
      nameEl.style.fontSize = '18px';
      const sponsorEntry = getTitleSponsorEntry(team.id, getDisplayYear(viewedSeason));
      if (sponsorEntry) {
        const sp = document.createElement('span');
        sp.className = 'team-sponsor';
        sp.textContent = sponsorEntry.sponsor.toUpperCase();
        nameEl.appendChild(sp);
      }
      const nameSpan = document.createElement('span');
      nameSpan.textContent = team.name.toUpperCase();
      nameEl.appendChild(nameSpan);
      // shrink font until name fits on one line (min 11px)
      let _fs = 18;
      while (nameEl.scrollWidth > nameEl.clientWidth && _fs > 11) {
        nameEl.style.fontSize = --_fs + 'px';
      }

      const metaEl = document.getElementById('team-meta');
      metaEl.innerHTML = '';
      const flagCode = NAT_CODE[team.nationality.toLowerCase()];
      if (flagCode) {
        const fi = document.createElement('img');
        fi.className = 'flag-strip';
        fi.alt = '';
        fi.src = `https://flagcdn.com/w160/${flagCode}.png`;
        metaEl.appendChild(fi);
      }
      const metaText = document.createElement('span');
      metaText.textContent = `${team.nationality.toUpperCase()} · EST. ${getDisplayYear(1)}`;
      metaEl.appendChild(metaText);
      document.getElementById('s-seasons').textContent       = seasonCount || '—';
      document.getElementById('s-wins').textContent          = totals.wins;
      document.getElementById('s-pts').textContent           = totals.pts;
      document.getElementById('s-titles').textContent        = totals.titles;

      document.getElementById('as-of-label').textContent = lastCompleted ? formatAsOfLabel(lastCompleted) : '';

      renderSeasonPane(team, viewedSeason);

      // History table — most recent first
      const tbody = document.getElementById('history-body');
      tbody.innerHTML = '';

      // Current partial season row (top, most recent)
      if (csEntry) {
        const csYear = getDisplayYear(currentSeason);
        const csPos  = (currentSeasonCtorStandings.constructors.findIndex(c => c.id === team.id) + 1) || '?';
        const activeRosterNow = getActiveRoster(currentSeason, worldSeed).filter(e => e.teamId === team.id);
        const csDriverNames   = activeRosterNow.map(e => {
          const pd = getDriverProfile(e.driverId);
          return pd ? pd.lastName : '—';
        }).join(' / ');
        const csTr = document.createElement('tr');
        csTr.innerHTML = `
          <td class="h-year">${csYear}</td>
          <td class="h-pos">${csPos}</td>
          <td>${csDriverNames}</td>
          <td class="h-pts">${csEntry.points}</td>
          <td class="h-wins">${csEntry.wins}</td>
        `;
        tbody.appendChild(csTr);
      }

      [...ctorHistory].reverse().forEach(hs => {
        const year      = getDisplayYear(hs.season);
        const standings = getStandings(hs.season);
        const posIdx    = standings.constructors.findIndex(c => c.id === team.id);
        const pos       = posIdx >= 0 ? posIdx + 1 : '?';

        const summary = loadSeasonSummary(hs.season);
        const driverNames = summary
          ? Object.values(summary.drivers)
              .filter(d => d.teamId === team.id)
              .map(d => {
                const parts = d.driverName.split(' ');
                return parts[parts.length - 1];
              })
              .join(' / ')
          : '—';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="h-year">${year}</td>
          <td class="h-pos">${pos}${hs.champion ? '<span class="champ-marker">★</span>' : ''}</td>
          <td>${driverNames}</td>
          <td class="h-pts">${hs.points}</td>
          <td class="h-wins">${hs.wins}</td>
        `;
        tbody.appendChild(tr);
      });

      setActiveTeam(true);

      document.title = `${team.name} — Simple Motor Racing`;
      window.history.replaceState(null, '', `team.html?id=${team.id}&season=${viewedSeason}`);
    }

    function bucket(val, [lo, hi]) {
      return val <= lo ? 1 : val <= hi ? 2 : 3;
    }

    function pips(level, cls, label) {
      const dots = [1,2,3].map(i =>
        `<span class="pip ${i <= level ? 'on' : 'off'}"></span>`
      ).join('');
      return `<span class="pip-group ${cls}">${dots}<span class="pip-label">${label}</span></span>`;
    }

    // ── Team scroller ──────────────────────────────────────────────────────────
    const teamScroller = document.getElementById('team-scroller');
    const tnavLeft     = document.getElementById('tnav-left');
    const tnavRight    = document.getElementById('tnav-right');

    function updateTeamArrows() {
      const atStart = teamScroller.scrollLeft <= 1;
      const atEnd   = teamScroller.scrollLeft >= teamScroller.scrollWidth - teamScroller.clientWidth - 1;
      tnavLeft.setAttribute('aria-hidden',  atStart ? 'true' : 'false');
      tnavRight.setAttribute('aria-hidden', atEnd   ? 'true' : 'false');
    }

    tnavLeft.addEventListener('click',  () => teamScroller.scrollBy({ left: -teamScroller.clientWidth * 0.6, behavior: 'smooth' }));
    tnavRight.addEventListener('click', () => teamScroller.scrollBy({ left:  teamScroller.clientWidth * 0.6, behavior: 'smooth' }));
    teamScroller.addEventListener('scroll', updateTeamArrows);

    function setActiveTeam(animate) {
      let activeBtn = null;
      teamScroller.querySelectorAll('.yr-btn').forEach(btn => {
        const isActive = +btn.dataset.i === teamIdx;
        btn.classList.toggle('active', isActive);
        if (isActive) activeBtn = btn;
      });
      if (!activeBtn) return;
      if (animate) {
        activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      } else {
        teamScroller.scrollLeft = activeBtn.offsetLeft - teamScroller.clientWidth / 2 + activeBtn.offsetWidth / 2;
      }
      updateTeamArrows();
    }

    function buildTeamScroller() {
      const inner = document.getElementById('team-scroll-inner');
      inner.innerHTML = '';
      SORTED_TEAMS.forEach((team, i) => {
        const btn = document.createElement('button');
        btn.className   = 'yr-btn' + (i === teamIdx ? ' active' : '');
        btn.textContent = team.shortName.toUpperCase();
        btn.dataset.i   = i;
        btn.addEventListener('click', () => {
          teamIdx = +btn.dataset.i;
          setActiveTeam(true);
          renderTeam(teamIdx);
        });
        inner.appendChild(btn);
      });
      setActiveTeam(false);
      updateTeamArrows();
    }

    // ── Year scroller ──────────────────────────────────────────────────────────
    const scroller   = document.getElementById('season-scroller');
    const arrowLeft  = document.getElementById('scroll-left');
    const arrowRight = document.getElementById('scroll-right');

    function updateArrows() {
      const atStart = scroller.scrollLeft <= 1;
      const atEnd   = scroller.scrollLeft >= scroller.scrollWidth - scroller.clientWidth - 1;
      arrowLeft.setAttribute('aria-hidden',  atStart ? 'true' : 'false');
      arrowRight.setAttribute('aria-hidden', atEnd   ? 'true' : 'false');
    }

    arrowLeft.addEventListener('click',  () => scroller.scrollBy({ left: -scroller.clientWidth * 0.6, behavior: 'smooth' }));
    arrowRight.addEventListener('click', () => scroller.scrollBy({ left:  scroller.clientWidth * 0.6, behavior: 'smooth' }));
    scroller.addEventListener('scroll', updateArrows);

    function setActiveYear(animate) {
      let activeBtn = null;
      scroller.querySelectorAll('.yr-btn').forEach(btn => {
        const isActive = +btn.dataset.s === viewedSeason;
        btn.classList.toggle('active', isActive);
        if (isActive) activeBtn = btn;
      });
      if (!activeBtn) return;
      if (animate) {
        activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      } else {
        scroller.scrollLeft = activeBtn.offsetLeft - scroller.clientWidth / 2 + activeBtn.offsetWidth / 2;
      }
      updateArrows();
    }

    function buildScroller() {
      const inner = document.getElementById('season-scroll-inner');
      inner.innerHTML = '';
      for (let s = 1; s <= currentSeason; s++) {
        const btn = document.createElement('button');
        btn.className   = 'yr-btn' + (s === viewedSeason ? ' active' : '');
        btn.textContent = getDisplayYear(s);
        btn.dataset.s   = s;
        btn.addEventListener('click', () => {
          viewedSeason = +btn.dataset.s;
          setActiveYear(true);
          const team = SORTED_TEAMS[teamIdx];
          renderSeasonPane(team, viewedSeason);
          window.history.replaceState(null, '', `team.html?id=${team.id}&season=${viewedSeason}`);
        });
        inner.appendChild(btn);
      }
      setActiveYear(false);
      updateArrows();
    }

    // ── Formula era popup ─────────────────────────────────────────────────────
    function closeFormulaPopup() {
      document.getElementById('formula-overlay').classList.remove('open');
      document.getElementById('formula-popup').classList.remove('open');
    }
    document.getElementById('formula-overlay').addEventListener('click', closeFormulaPopup);
    document.getElementById('formula-popup-close').addEventListener('click', closeFormulaPopup);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFormulaPopup(); });

    (async () => {
      await new Promise(r => setTimeout(r, 0)); // yield to browser so loading state paints
      try {
        const mod = await import('./sponsors.js');
        getTitleSponsorEntry = mod.getTitleSponsorEntry;
      } catch {}
      const loadingEl = document.getElementById('loading-state');
      for (let s = 1; s <= currentSeason; s++) {
        loadingEl.textContent = `COMPUTING SEASON ${getDisplayYear(s)}…`;
        await ensurePastResultsCached(s, simFns);
      }
      lastCompleted = getLastCompletedRace();
      if (lastCompleted && lastCompleted.season === currentSeason) {
        currentSeasonCtorStandings = getStandingsThroughRound(currentSeason, lastCompleted.round);
      }
      loadingEl.style.display = 'none';
      document.getElementById('team-nav-wrap').style.display = '';
      document.getElementById('page').style.display = '';
      buildScroller();
      buildTeamScroller();
      renderTeam(teamIdx);
    })();
  </script>

  <div id="formula-overlay"></div>
  <div id="formula-popup">
    <div id="formula-popup-inner"></div>
    <button id="formula-popup-close">CLOSE</button>
  </div>

</body>
</html>
